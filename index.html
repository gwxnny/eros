<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eros</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Adelia is a licensed font. Put your file at fonts/Adelia.woff2 (see README). Until then the wordmark uses the fallback stack below. */
    @font-face {
      font-family: "Adelia";
      src: url("fonts/Adelia.woff2") format("woff2");
      font-display: swap
    }

    :root {
      --pink: #F8E3E8;
      --blue: #C2DAE8;
      --bg: #FFFCFA;
      --bg2: #F8F4F1;
      --card: #fff;
      --text: #40383A;
      --text2: #8B7D82;
      --line: #EEE5E7;
      --rose: #C9788C;
      --sky: #5E8BA6;
      --on-accent: #fff;
      --shadow: 0 6px 24px rgba(64, 56, 58, .07)
    }

    [data-theme=dark] {
      --bg: #201D22;
      --bg2: #29252C;
      --card: #312C34;
      --text: #F7F0F3;
      --text2: #BEB1BC;
      --line: #443B46;
      --rose: #F8E3E8;
      --sky: #C2DAE8;
      --on-accent: #201D22;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Dongle", system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.1;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
    }

    h1,
    h2,
    h3 {
      font-weight: 700;
      margin: 0 0 .3em;
      line-height: .95
    }

    h1 {
      font-size: 3.2rem
    }

    h2 {
      font-size: 2.2rem
    }

    h3 {
      font-size: 1.6rem
    }

    p {
      margin: 0 0 .6em;
      line-height: 1.15
    }

    .logo {
      font-family: "Adelia", "Snell Roundhand", "Brush Script MT", cursive;
      font-size: 2.4rem;
      color: var(--rose);
      line-height: 1
    }

    .muted {
      color: var(--text2)
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 2px
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: .35em 1.1em;
      font-weight: 700;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent);
      min-height: 44px;
      font-size: 1.2rem
    }

    .btn.alt {
      background: var(--blue);
      color: #33444F
    }

    .btn.ghost {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--text)
    }

    .btn.danger {
      background: transparent;
      border: 1.5px solid var(--rose);
      color: var(--rose)
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow)
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr))
    }

    label {
      display: block;
      margin: .5em 0 .1em;
      color: var(--text2)
    }

    input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      min-height: 46px;
      font-size: 1.2rem
    }

    .pw {
      position: relative
    }

    .pw button {
      position: absolute;
      right: 6px;
      top: 4px;
      min-height: 38px;
      padding: 0 .8em
    }

    .err {
      color: #B3414F;
      min-height: 1.2em;
      margin-top: .4em
    }

    [data-theme=dark] .err {
      color: #F2A0AB
    }

    .ok {
      color: var(--sky)
    }

    /* hero */
    .hero {
      display: grid;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))
    }

    .polaroids {
      position: relative;
      height: 300px
    }

    .pol {
      position: absolute;
      width: 150px;
      background: #fff;
      padding: 10px 10px 34px;
      box-shadow: var(--shadow);
      border-radius: 4px;
      color: #40383A;
      font-size: 1.2rem;
      text-align: center
    }

    .pol i {
      display: block;
      height: 120px;
      background: var(--pink)
    }

    .pol.b i {
      background: var(--blue)
    }

    .pol.a {
      left: 6%;
      top: 20px;
      transform: rotate(-6deg)
    }

    .pol.b {
      left: 42%;
      top: 70px;
      transform: rotate(5deg)
    }

    .pol.c {
      left: 18%;
      top: 150px;
      transform: rotate(-2deg)
    }

    .stat {
      font-size: 4rem;
      font-weight: 700;
      line-height: .9
    }

    .code {
      font-size: 2.6rem;
      letter-spacing: .15em;
      background: var(--bg2);
      border-radius: 14px;
      padding: .1em .5em;
      display: inline-block
    }

    .pill {
      background: var(--pink);
      color: #6B4650;
      border-radius: 999px;
      padding: .1em .7em;
      display: inline-block
    }

    [data-theme=dark] .pill {
      background: #4a3a44;
      color: var(--pink)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: .3em 1em;
      border-radius: 999px;
      z-index: 9
    }

    @media (prefers-reduced-motion:no-preference) {
      .btn {
        transition: transform .15s
      }

      .btn:active {
        transform: scale(.97)
      }
    }

    .nav {
      display: flex;
      gap: 6px
    }

    .nav button {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 1.3rem;
      padding: .2em .8em;
      border-radius: 999px;
      min-height: 44px;
      color: var(--text2)
    }

    .nav button.on {
      background: var(--pink);
      color: #6B4650
    }

    [data-theme=dark] .nav button.on {
      background: #4a3a44;
      color: var(--pink)
    }

    @media(max-width:640px) {
      body {
        padding-bottom: 76px
      }

      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        justify-content: space-around;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0))
      }
    }

    .mem {
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .ph {
      aspect-ratio: 4/3;
      width: 100%;
      flex: none;
      background: var(--pink) center/cover no-repeat
    }

    .mem .pad {
      padding: 12px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start
    }

    .mem h3,
    .mem p {
      margin: 0;
      width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1
    }

    .mem p {
      -webkit-line-clamp: 2;
      min-height: 2.3em
    }

    .mem .tag {
      margin-top: auto
    }

    .tag {
      background: var(--blue);
      color: #33444F;
      border-radius: 999px;
      padding: 0 .6em;
      margin-right: .3em;
      display: inline-block
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: .6em 0
    }

    .chips button {
      border: 1.5px solid var(--line);
      background: none;
      border-radius: 999px;
      padding: .1em .9em;
      min-height: 40px;
      cursor: pointer;
      font-size: 1.2rem
    }

    .chips button.on {
      background: var(--blue);
      color: #33444F;
      border-color: var(--blue)
    }

    textarea,
    select {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      font: inherit;
      font-size: 1.2rem;
      color: inherit;
      min-height: 46px
    }

    dialog.wide {
      width: min(94vw, 560px);
      max-height: 90vh
    }

    dialog::backdrop {
      background: rgba(32, 29, 34, .5)
    }

    .thumbs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .thumbs div {
      position: relative
    }

    .thumbs img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px
    }

    .thumbs button {
      position: absolute;
      top: -6px;
      right: -6px;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      border: 0;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent)
    }

    dialog {
      width: min(94vw, 560px);
      max-height: 90vh;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      color: var(--text)
    }

    .mgrid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      align-items: stretch
    }

    .fab {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 0;
      background: var(--rose);
      color: var(--on-accent);
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 6;
      display: grid;
      place-items: center
    }

    @media(max-width:640px) {
      .fab {
        bottom: calc(88px + env(safe-area-inset-bottom, 0px))
      }
    }

    .cw {
      position: relative;
      margin-bottom: .6em
    }

    .car {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      border-radius: 14px;
      scrollbar-width: none
    }

    .car::-webkit-scrollbar {
      display: none
    }

    .sl {
      flex: 0 0 100%;
      scroll-snap-align: center;
      height: min(45vh, 420px);
      background: var(--bg2)
    }

    .sl img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      display: block
    }

    .ar,
    .zx {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .88);
      color: #40383A;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2
    }

    .ar {
      top: 50%;
      transform: translateY(-50%)
    }

    .ar.l {
      left: 8px
    }

    .ar.r {
      right: 8px
    }

    .zx {
      top: 8px;
      right: 8px
    }

    .dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .25)
    }

    .dots i.on {
      background: var(--rose)
    }

    .ri {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      min-height: 64px
    }

    .ri .th {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      flex: none;
      background: var(--pink) center/cover
    }

    .tl {
      border-left: 3px solid var(--blue);
      padding-left: 14px
    }

    .tlh {
      margin-top: .8em
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-top: .6em
    }

    .cg b {
      color: var(--text2)
    }

    .cd {
      min-height: 46px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      border: 0;
      background: none;
      font-size: 1.2rem
    }

    .cd.has {
      background: var(--pink);
      color: #6B4650;
      cursor: pointer;
      font-weight: 700
    }

    [data-theme=dark] .cd.has {
      background: #4a3a44;
      color: var(--pink)
    }

    .cd.sel {
      outline: 2px solid var(--rose)
    }

    .cd i {
      font-size: .85rem;
      font-style: normal;
      line-height: 1
    }

    .hs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px
    }

    .hs .mem {
      width: 220px;
      flex: none
    }

    summary {
      cursor: pointer;
      list-style: none
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap
    }

    .stats div {
      font-size: 1.2rem;
      color: var(--text2)
    }

    .stats b {
      display: block;
      font-size: 2.6rem;
      color: var(--text);
      line-height: 1
    }

    dialog#lb {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: rgba(20, 17, 22, .95);
      color: #F7F0F3;
      overflow: hidden
    }

    dialog#lb::backdrop {
      background: transparent
    }

    #lb .bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 70px 0 18px;
      display: flex;
      align-items: center;
      font-size: 1.3rem;
      z-index: 1
    }

    #lb .st {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(56px + env(safe-area-inset-top, 0px));
      bottom: 96px;
      overflow: auto;
      display: flex
    }

    #lb .st img {
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      border-radius: 6px
    }

    #lb .st.z img {
      max-width: none;
      max-height: none;
      width: 200%;
      cursor: zoom-out
    }

    #lb .tn {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      overflow-x: auto
    }

    #lb .tn button {
      width: 56px;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0;
      background: var(--pink) center/cover;
      cursor: pointer;
      opacity: .55;
      flex: none
    }

    #lb .tn button.on {
      opacity: 1;
      border-color: var(--pink)
    }

    #lb .ar {
      background: rgba(255, 255, 255, .16);
      color: #fff
    }

    #lb .zx {
      background: rgba(255, 255, 255, .16);
      color: #fff;
      top: calc(6px + env(safe-area-inset-top, 0px))
    }

    @media(prefers-reduced-motion:no-preference) {
      #lb .st img {
        animation: lbi .25s
      }

      @keyframes lbi {
        from {
          opacity: 0;
          transform: scale(.98)
        }

        to {
          opacity: 1
        }
      }
    }

    .tli {
      position: relative;
      margin: 0 0 14px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .tli::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--rose)
    }

    .tli.auto::before {
      background: var(--blue)
    }

    .tli h3 {
      margin: .2em 0
    }

    @media(max-width:640px) {
      .nav button {
        padding: .2em .55em;
        font-size: 1.15rem
      }
    }
  </style>
</head>

<body>
  <div id="app" class="wrap">
    <p class="muted">Loading…</p>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const SUPABASE_URL = "https://hhsejvipqxtgswygwwcv.supabase.co";
    // Anon key is public by design. Your data is protected by the row-level security rules in schema.sql.
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imhoc2VqdmlwcXh0Z3N3eWd3d2N2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1MTMwNDcsImV4cCI6MjEwNzA4OTA0N30.xLtHIu6wUp6PYauQhuOAYMSqjpQCvSg9f0NvjbobOmI";
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const $ = s => document.querySelector(s), app = $("#app");
    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
    let S = {user: null, profile: null, couple: null, members: [], authMode: "login"};

    /* theme */
    function setTheme(t) {try {localStorage.setItem("eros-theme", t)} catch (e) { } applyTheme()}
    function applyTheme() {
      let t = "auto"; try {t = localStorage.getItem("eros-theme") || "auto"} catch (e) { }
      const dark = t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme:dark)").matches);
      document.documentElement.dataset.theme = dark ? "dark" : "light"
    }
    function toggleTheme() {setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"); render()}
    applyTheme();

    function toast(m) {const t = document.createElement("div"); t.className = "toast"; t.textContent = m; t.setAttribute("role", "status"); document.body.append(t); setTimeout(() => t.remove(), 2600)}
    const themeBtn = () => `<button class="btn ghost" data-act="theme" aria-label="Switch between light and dark mode">${document.documentElement.dataset.theme === "dark" ? "Light mode" : "Dark mode"}</button>`;
    const msg = e => e && e.message ? e.message : "Something went wrong. Please try again.";

    /* invite code from link */
    const urlCode = new URLSearchParams(location.search).get("invite");
    if (urlCode) {try {localStorage.setItem("eros-invite", urlCode.toUpperCase())} catch (e) { } history.replaceState({}, "", location.pathname)}
    const pendingCode = () => {try {return localStorage.getItem("eros-invite")} catch (e) {return null} };
    const clearCode = () => {try {localStorage.removeItem("eros-invite")} catch (e) { } };

    /* data */
    async function load() {
      const {data: {session}} = await sb.auth.getSession();
      S.user = session?.user || null;
      if (!S.user) {S.profile = S.couple = null; return }
      const p = await sb.from("profiles").select("*").eq("id", S.user.id).maybeSingle(); S.profile = p.data;
      const m = await sb.from("couple_members").select("couple_id").eq("user_id", S.user.id).maybeSingle();
      if (m.data) {
        const c = await sb.from("couples").select("*").eq("id", m.data.couple_id).single(); S.couple = c.data;
        const ms = await sb.from("couple_members").select("user_id").eq("couple_id", m.data.couple_id);
        const ids = (ms.data || []).map(x => x.user_id);
        const pr = await sb.from("profiles").select("id,display_name").in("id", ids);
        S.members = pr.data || [];
        if (S.couple && !S.couple.invite_code && ids.length < 2) {const iv = await sb.from("invites").select("code,expires_at").eq("couple_id", S.couple.id).is("accepted_at", null).maybeSingle(); S.invite = iv.data} else S.invite = null;
      } else {S.couple = null; S.members = []; S.invite = null}
    }

    /* views */
    function render() {
      if (!S.user) return landing();
      if (!S.couple) return onboarding();
      if (S.page === "diary") return diary(); if (S.page === "timeline") return timeline(); if (S.page === "persp") return persp(); dashboard(); return homeWidgets();
    }
    function landing() {
      const signup = S.authMode === "signup", forgot = S.authMode === "forgot";
      app.innerHTML = `<div class="top"><span class="logo">Eros</span>${themeBtn()}</div>
  <section class="hero"><div>

  <details id="fd" ${S.fo ? "open" : ""}><summary class="btn ghost" style="display:inline-flex;align-items:center">Filters</summary><div class="grid" style="margin:.6em 0">${sel("fc", "Category", cats)}${sel("ft", "Tag", tags)}${sel("fl", "Location", locs)}<div><label for="sfd1">From</label><input id="sfd1" type="date" data-flt="fd1" value="${S.fd1}"></div><div><label for="sfd2">To</label><input id="sfd2" type="date" data-flt="fd2" value="${S.fd2}"></div><div><label for="sfb">Created by</label><select id="sfb" data-flt="fb"><option value="">Anyone</option><option value="me" ${S.fb === "me" ? "selected" : ""}>Me</option><option value="p" ${S.fb === "p" ? "selected" : ""}>My partner</option></select></div></div><button class="btn ghost" data-act="clr">Clear filters</button></details>
  ${S.memErr ? `<p class="err">${esc(msg(S.memErr))} Did you run schema_2a.sql?</p>` : ""}<div id="res" style="margin-top:12px"></div><dialog id="dlg"></dialog><dialog id="lb"></dialog>`; drawRes()
    }
    async function diary() {app.innerHTML = topbar() + `<h1>Memory Diary</h1><p class="muted">Loading…</p>`; await loadMems(); paint()}
    async function homeWidgets() {await loadMems(); drawWid()}
    function drawWid() {
      const el = $("#wid"); if (!el) return; const mm = S.mems.filter(m => !m.archived), t = new Date(), md = `${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
      if (S.ti == null || S.ti >= mm.length) S.ti = Math.floor(Math.random() * mm.length);
      const tm = mm[S.ti], oth = mm.filter(m => m.memory_date.slice(5) === md && +m.memory_date.slice(0, 4) < t.getFullYear()), rec = [...mm].sort((a, b) => b.created_at.localeCompare(a.created_at)).slice(0, 6);
      el.innerHTML = `<div class="grid"><div class="card"><h3>Today's memory</h3>${tm ? mrow(tm) + (mm.length > 1 ? `<button class="btn ghost" data-act="anotm">Show another</button>` : "") : `<p class="muted">Add a memory and it will show up here.</p><button class="btn alt" data-act="newmem">Add a memory</button>`}</div>
  <div class="card"><h3>On this day</h3>${oth.length ? oth.slice(0, 3).map(mrow).join("") : `<p class="muted">Nothing from this date in past years yet.</p>`}</div>
  <div class="card"><h3>Memory stats</h3><div class="stats"><div><b>${mm.length}</b>memories</div><div><b>${mm.reduce((n, m) => n + m.photos.length, 0)}</b>photos</div><div><b>${mm.filter(m => m.category === "Dates").length}</b>dates</div><div><b>${new Set(mm.map(m => m.location).filter(Boolean)).size}</b>places</div></div></div></div>
  ${rec.length ? `<h3 style="margin-top:1em">Recently added</h3><div class="hs">${rec.map(mcard).join("")}</div>` : ""}`
    }
    document.addEventListener("input", e => {const k = e.target.dataset && e.target.dataset.flt; if (!k) return; S[k] = e.target.value; drawRes()});
    document.addEventListener("toggle", e => {if (e.target.id === "fd") S.fo = e.target.open}, true);
    document.addEventListener("scroll", e => {if (e.target.id === "car") {const i = Math.round(e.target.scrollLeft / e.target.clientWidth); document.querySelectorAll("#dots i").forEach((d, j) => d.classList.toggle("on", j === i))} }, true);
    function zoom(i) {S.zi = i; const m = S.cur, n = m.photos.length, lb = $("#lb"); lb.innerHTML = `<div class="bar">${n > 1 ? `${i + 1} / ${n} · ` : ""}${esc(m.title)}</div><div class="st" id="st"><img src="${S.urls[m.photos[i]] || ""}" alt="Photo ${i + 1} of ${n} from ${esc(m.title)}. Select to zoom." data-act="ztog"></div>${n > 1 ? `<button class="ar l" data-act="zstep" data-d="-1" aria-label="Previous photo">‹</button><button class="ar r" data-act="zstep" data-d="1" aria-label="Next photo">›</button><div class="tn">${m.photos.map((p, j) => `<button data-act="zjump" data-i="${j}" class="${j === i ? "on" : ""}" aria-label="Photo ${j + 1}" style="background-image:url('${S.urls[p] || ""}')"></button>`).join("")}</div>` : ""}<button class="zx" data-act="zclose" aria-label="Close">×</button>`; if (!lb.open) lb.showModal()}
    document.addEventListener("keydown", e => {const lb = $("#lb"); if (!lb || !lb.open || !S.cur) return; const n = S.cur.photos.length; if (e.key === "ArrowRight") zoom((S.zi + 1) % n); if (e.key === "ArrowLeft") zoom((S.zi + n - 1) % n)});
    let tx = 0; document.addEventListener("touchstart", e => {tx = e.touches[0].clientX}, {passive: true});
    document.addEventListener("touchend", e => {const lb = $("#lb"); if (!lb || !lb.open || $("#st")?.classList.contains("z")) return; const dx = e.changedTouches[0].clientX - tx, n = S.cur.photos.length; if (Math.abs(dx) > 60 && n > 1) zoom((S.zi + (dx < 0 ? 1 : n - 1)) % n)});
    function shrink(file) {return new Promise((res, rej) => {const img = new Image(), u = URL.createObjectURL(file); img.onload = () => {const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); c.toBlob(b => b ? res(b) : rej(new Error("Could not process " + file.name)), "image/jpeg", .85)}; img.onerror = () => rej(new Error(file.name + " isn't a readable image")); img.src = u})}
    async function editor(m) {
      await ensureDlg(); const keep = [...(m?.photos || [])]; await signed(keep);
      const thumbs = () => $("#th").innerHTML = keep.map((p, i) => `<div><img src="${S.urls[p] || ""}" alt=""><button type="button" data-act="rmph" data-i="${i}" aria-label="Remove photo">×</button></div>`).join("");
      window.__keep = keep; window.__thumbs = thumbs;
      dialog(`<h3>${m ? "Edit memory" : "New memory"}</h3>
  <label for="mt">Title</label><input id="mt" maxlength="200" value="${esc(m?.title || "")}">
  <label for="md">Date</label><input id="md" type="date" value="${m?.memory_date || new Date().toISOString().slice(0, 10)}">
  <label for="ml">Location</label><input id="ml" value="${esc(m?.location || "")}">
  <label for="mc">Category</label><select id="mc">${CATS.map(c => `<option ${c === (m?.category || CATS[0]) ? "selected" : ""}>${c}</option>`).join("")}</select>
  <label for="ms">Story</label><textarea id="ms" rows="4">${esc(m?.story || "")}</textarea>
  <label for="mg">Tags (comma separated)</label><input id="mg" value="${esc((m?.tags || []).join(", "))}">
  <label for="mp">Photos (up to 8, JPG/PNG/WebP)</label><input id="mp" type="file" accept="image/jpeg,image/png,image/webp" multiple><div class="thumbs" id="th" style="margin-top:.5em"></div>`,
        async () => {
          const title = $("#mt").value.trim(); if (!title) return "Give this memory a title.";
          const files = [...$("#mp").files]; if (keep.length + files.length > 8) return "A memory can hold up to 8 photos.";
          for (const f of files) {if (!/^image\/(jpeg|png|webp)$/.test(f.type)) return f.name + " isn't a JPG, PNG or WebP."; if (f.size > 25e6) return f.name + " is over 25 MB."}
          const id = m?.id || crypto.randomUUID(), paths = [...keep];
          try {
            for (let i = 0; i < files.length; i++) {
              $("#derr").textContent = `Uploading photo ${i + 1} of ${files.length}…`;
              const blob = await shrink(files[i]), path = `${S.couple.id}/${id}/${crypto.randomUUID()}.jpg`;
              const up = await sb.storage.from("memories").upload(path, blob, {contentType: "image/jpeg"}); if (up.error) throw up.error; paths.push(path)
            }
          } catch (e) {return "Upload failed: " + msg(e)}
          const row = {
            title, memory_date: $("#md").value, location: $("#ml").value.trim() || null, category: $("#mc").value, story: $("#ms").value.trim() || null,
            tags: $("#mg").value.split(",").map(t => t.trim()).filter(Boolean).slice(0, 12), photos: paths, updated_at: new Date().toISOString()
          };
          const r = m ? await sb.from("memories").update(row).eq("id", id) : await sb.from("memories").insert({...row, id, couple_id: S.couple.id});
          if (r.error) return msg(r.error);
          if (m) {const gone = (m.photos || []).filter(p => !paths.includes(p)); if (gone.length) await sb.storage.from("memories").remove(gone)}
          S.page = "diary"; render(); toast("Memory saved")
        });
      thumbs();
    }
    async function ensureDlg() {if (!S.couple) return; if (S.page !== "diary") {S.page = "diary"; await diary()} }
    function viewMem(m) {
      const d = $("#dlg"), n = m.photos.length; S.cur = m;
      d.innerHTML = `${n ? `<div class="cw"><div class="car" id="car">${m.photos.map((p, i) => `<div class="sl"><img src="${S.urls[p] || ""}" alt="Photo ${i + 1} of ${n} from ${esc(m.title)}. Select to enlarge." data-act="zoom" data-i="${i}"></div>`).join("")}</div>${n > 1 ? `<button class="ar l" data-act="slide" data-d="-1" aria-label="Previous photo">‹</button><button class="ar r" data-act="slide" data-d="1" aria-label="Next photo">›</button><div class="dots" id="dots">${m.photos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}</div>` : ""}
  <h2>${esc(m.title)}</h2><p class="muted">${new Date(m.memory_date + "T00:00").toLocaleDateString(undefined, {dateStyle: "long"})}${m.location ? " · " + esc(m.location) : ""}</p>
  <p><span class="tag">${esc(m.category)}</span>${m.tags.map(t => `<span class="tag">#${esc(t)}</span>`).join("")}</p>
  ${m.story ? `<p style="white-space:pre-wrap">${esc(m.story)}</p>` : ""}
  <div class="row"><button class="btn alt" data-act="fav" data-id="${m.id}">${m.favourite ? "Unfavourite" : "Favourite"}</button><button class="btn ghost" data-act="edit1" data-id="${m.id}">Edit</button><button class="btn ghost" data-act="arch" data-id="${m.id}">${m.archived ? "Restore" : "Archive"}</button><button class="btn danger" data-act="del" data-id="${m.id}">Delete</button><button class="btn ghost" data-act="close">Close</button></div>`; d.showModal()
    }
    async function openMem(id) {await signed(S.mems.find(x => x.id === id).photos); viewMem(S.mems.find(x => x.id === id))}


    /* ---------- Timeline (2c) ---------- */
    const KINDS = ["First meeting", "First date", "Relationship start", "Anniversary", "Birthday", "Trip", "Special occasion", "Gift", "Milestone", "Everyday"];
    S.tlm = false; S.tl = []; S.ps = []; S.pc = {};
    async function timeline() {
      app.innerHTML = topbar() + `<h1>Our timeline</h1><p class="muted">Loading…</p>`;
      const [t] = await Promise.all([sb.from("timeline_entries").select("*").eq("couple_id", S.couple.id), loadMems()]); S.tl = t.data || []; S.tlErr = t.error; tlPaint()
    }
    function tlItems() {
      const it = S.tl.map(e => ({d: e.entry_date, t: e.title, k: e.kind, n: e.note, id: e.id, mem: e.memory_id, e: 1})), sd = S.couple.start_date, today = new Date().toLocaleDateString("sv");
      if (sd) {
        if (!S.tl.some(e => e.kind === "Relationship start")) it.push({d: sd, t: "Our story begins", k: "Relationship start", n: "From your start date."});
        const y0 = +sd.slice(0, 4); for (let y = y0 + 1; y <= +today.slice(0, 4); y++) {const d = y + sd.slice(4); if (d <= today) it.push({d, t: `${y - y0} year${y - y0 > 1 ? "s" : ""} together`, k: "Anniversary"})}
      }
      if (S.tlm) S.mems.filter(m => !m.archived).forEach(m => it.push({d: m.memory_date, t: m.title, k: "Diary memory", mem: m.id}));
      return it.sort((a, b) => a.d.localeCompare(b.d))
    }
    function tlPaint() {
      const it = tlItems(), yrs = [...new Set(it.map(x => x.d.slice(0, 4)))];
      const rec = y => {const mm = S.mems.filter(m => !m.archived && m.memory_date.startsWith(y)); return `${it.filter(x => x.d.startsWith(y)).length} moments · ${mm.length} diary memories · ${mm.reduce((n, m) => n + m.photos.length, 0)} photos`};
      let h = "", last = ""; it.forEach(x => {
        const y = x.d.slice(0, 4); if (y !== last) {h += `<h2 class="tlh" id="y${y}">${y}</h2><p class="muted">${rec(y)}</p>`; last = y}
        h += `<div class="tli ${x.e ? "" : "auto"}"><span class="muted">${fdt(x.d)}</span> <span class="tag">${esc(x.k)}</span><h3>${esc(x.t)}</h3>${x.n ? `<p>${esc(x.n)}</p>` : ""}<div class="row">${x.mem && S.mems.some(m => m.id === x.mem) ? `<button class="btn ghost" data-act="open" data-id="${x.mem}">Open memory</button>` : ""}${x.e ? `<button class="btn ghost" data-act="tedit" data-id="${x.id}">Edit</button>` : ""}</div></div>`
      });
      app.innerHTML = topbar() + `<h1>Our timeline</h1><div class="row"><button class="btn" data-act="tedit" data-id="">Add a moment</button><div class="chips" style="margin:0"><button data-act="ttog" class="${S.tlm ? "on" : ""}">Show diary memories</button></div>${yrs.length > 1 ? `<select id="jy" aria-label="Jump to year" style="width:auto"><option value="">Jump to year</option>${yrs.map(y => `<option>${y}</option>`).join("")}</select>` : ""}</div>${S.tlErr ? `<p class="err">${esc(msg(S.tlErr))} Did you run schema_2c.sql?</p>` : ""}<div class="tl" style="margin-top:12px">${h || `<div class="card"><p class="muted">Add your first moment, like the day you met.</p></div>`}</div><dialog id="dlg"></dialog><dialog id="lb"></dialog>`
    }
    document.addEventListener("change", e => {if (e.target.id === "jy" && e.target.value) document.getElementById("y" + e.target.value)?.scrollIntoView({behavior: "smooth"})});
    function tedit(id) {
      const e = S.tl.find(x => x.id === id), ms = S.mems.filter(m => !m.archived);
      dialog(`<h3>${e ? "Edit moment" : "Add a moment"}</h3><label for="tt">Title</label><input id="tt" maxlength="200" value="${esc(e?.title || "")}"><label for="td">Date</label><input id="td" type="date" value="${e?.entry_date || new Date().toLocaleDateString("sv")}"><label for="tk">Type</label><select id="tk">${KINDS.map(k => `<option ${k === (e?.kind || "Milestone") ? "selected" : ""}>${k}</option>`).join("")}</select><label for="tn">Note</label><textarea id="tn" rows="3">${esc(e?.note || "")}</textarea><label for="tm">Link to a diary memory</label><select id="tm"><option value="">None</option>${ms.map(m => `<option value="${m.id}" ${e?.memory_id === m.id ? "selected" : ""}>${esc(m.title)} (${fdt(m.memory_date)})</option>`).join("")}</select>${e ? `<p><button type="button" class="btn danger" data-act="tdel" data-id="${e.id}">Delete this moment</button></p>` : ""}`,
        async () => {
          const title = $("#tt").value.trim(); if (!title) return "Give this moment a title."; if (!$("#td").value) return "Pick a date.";
          const row = {title, entry_date: $("#td").value, kind: $("#tk").value, note: $("#tn").value.trim() || null, memory_id: $("#tm").value || null};
          const r = e ? await sb.from("timeline_entries").update(row).eq("id", e.id) : await sb.from("timeline_entries").insert({...row, couple_id: S.couple.id});
          if (r.error) return msg(r.error); await timeline(); toast("Saved")
        })
    }
    /* ---------- Two Perspectives (2c) ---------- */
    async function persp() {
      app.innerHTML = topbar() + `<h1>Two Perspectives</h1><p class="muted">Loading…</p>`;
      const [p, c] = await Promise.all([sb.from("perspectives").select("*").eq("couple_id", S.couple.id).order("created_at", {ascending: false}), sb.rpc("perspective_counts")]);
      S.ps = p.data || []; S.pe = p.error; S.pc = {}; (c.data || []).forEach(x => S.pc[x.pid] = x); paintP()
    }
    const isRev = p => (S.pc[p.id]?.n >= 2) || (p.reveal_mode === "date" && p.reveal_at && new Date(p.reveal_at) <= new Date());
    function paintP() {
      app.innerHTML = topbar() + `<h1>Two Perspectives</h1><p class="muted">You each write your own version of a moment. Neither of you sees the other's until you've both answered, or the reveal date arrives.</p><button class="btn" data-act="padd">Start a new one</button>${S.pe ? `<p class="err">${esc(msg(S.pe))} Did you run schema_2c.sql?</p>` : ""}
  <div class="grid" style="margin-top:12px">${S.ps.map(p => {const c = S.pc[p.id] || {}, st = isRev(p) ? "Revealed" : c.mine ? "Waiting for partner" : "Your turn"; return `<button class="card mem" data-act="popen" data-id="${p.id}" style="height:auto"><div class="pad"><h3>${esc(p.title)}</h3><p class="muted">${esc(p.prompt || "")}</p><span class="tag">${st}</span></div></button>`}).join("") || `<div class="card"><p class="muted">Nothing yet. Pick a moment you both remember and see how differently you tell it.</p></div>`}</div><dialog id="dlg"></dialog><dialog id="lb"></dialog>`
    }
    function padd() {
      dialog(`<h3>New Two Perspectives</h3><label for="pt">What moment is it about?</label><input id="pt" maxlength="200" placeholder="Our first date"><label for="pp">Prompt (optional)</label><input id="pp" value="Write down how you remember it."><label for="pm">Reveal</label><select id="pm"><option value="both">When we've both answered</option><option value="date">On a date</option></select><label for="pd">Reveal date (for "On a date")</label><input id="pd" type="date">`,
        async () => {
          const t = $("#pt").value.trim(); if (!t) return "Name the moment."; const mode = $("#pm").value, dv = $("#pd").value; if (mode === "date" && !dv) return "Pick a reveal date.";
          const r = await sb.from("perspectives").insert({couple_id: S.couple.id, title: t, prompt: $("#pp").value.trim() || null, reveal_mode: mode, reveal_at: mode === "date" ? new Date(dv + "T00:00").toISOString() : null}).select().single();
          if (r.error) return msg(r.error); await persp(); popen(r.data.id)
        })
    }
    async function popen(id) {
      const p = S.ps.find(x => x.id === id), r = await sb.from("perspective_answers").select("*").eq("perspective_id", id); if (r.error) return toast(msg(r.error));
      const mine = r.data.find(a => a.user_id === S.user.id), oth = r.data.find(a => a.user_id !== S.user.id), rev = !!oth || (p.reveal_mode === "date" && p.reveal_at && new Date(p.reveal_at) <= new Date()), nm = S.members.find(x => oth && x.id === oth.user_id)?.display_name || "Your partner", d = $("#dlg");
      d.innerHTML = `<h2>${esc(p.title)}</h2>${p.prompt ? `<p class="muted">${esc(p.prompt)}</p>` : ""}` + (rev ? `<div class="grid">${[["You", mine], [nm, oth]].map(([n, a]) => `<div class="card"><h3>${esc(n)}</h3><p style="white-space:pre-wrap">${a ? esc(a.body) : "No answer."}</p></div>`).join("")}</div><h3 style="margin-top:1em">Our reflection</h3><label for="pr">Something you both took from it</label><textarea id="pr" rows="3">${esc(p.reflection || "")}</textarea><div class="err" id="perr" role="alert"></div><button class="btn alt" data-act="prefl" data-id="${id}">Save reflection</button>`
        : `<label for="pa">Your version</label><textarea id="pa" rows="6" maxlength="8000">${esc(mine?.body || "")}</textarea><div class="err" id="perr" role="alert"></div><button class="btn" data-act="psave" data-id="${id}">${mine ? "Update my version" : "Submit my version"}</button><p class="muted">${mine ? "Saved. Waiting for your partner. You can edit until it's revealed." : "Your partner can't see this until the reveal."}${p.reveal_mode === "date" && p.reveal_at ? ` Reveals on ${new Date(p.reveal_at).toLocaleDateString()}.` : ""}</p>`)
        + `<div class="row" style="margin-top:.8em">${p.created_by === S.user.id ? `<button class="btn danger" data-act="pdel" data-id="${id}">Delete</button>` : ""}<button class="btn ghost" data-act="close">Close</button></div>`; d.showModal()
    }

    /* boot */
    sb.auth.onAuthStateChange(async (evt) => {
      if (evt === "PASSWORD_RECOVERY") {await load(); render(); setTimeout(() => document.querySelector('[data-act=pw]')?.click(), 0); return }
      if (evt === "INITIAL_SESSION" || evt === "SIGNED_IN" || evt === "SIGNED_OUT" || evt === "USER_UPDATED") {
        setTimeout(async () => {
          await load();
          if (S.user && !S.couple && pendingCode()) {const r = await sb.rpc("accept_invite", {p_code: pendingCode()}); if (!r.error) {clearCode(); await load(); toast("You're paired. Welcome in!")} }
          render()
        }, 0)
      }
    });
  </script>
</body>
