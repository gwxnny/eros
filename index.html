<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <script>try { var t = localStorage.getItem("eros-theme") || "auto"; document.documentElement.dataset.theme = (t === "dark" || (t === "auto" && matchMedia("(prefers-color-scheme:dark)").matches)) ? "dark" : "light" } catch (e) { }</script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eros</title>
  <link rel="icon" type="image/png" href="Assets/images/logo.png">
  <link rel="apple-touch-icon" href="Assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Logo wordmark font: Tourmines. Keep the file at Assets/font/Tourmines.otf (folder names are case-sensitive on Netlify). */
    @font-face {
      font-family: "Tourmines";
      src: url("Assets/font/Tourmines.otf") format("opentype");
      font-display: swap
    }

    :root {
      --pink: #F8E3E8;
      --blue: #C2DAE8;
      --bg: #FFFCFA;
      --bg2: #F8F4F1;
      --card: #fff;
      --text: #40383A;
      --text2: #6E6065;
      --line: #EEE5E7;
      --rose: #B05E74;
      --sky: #4A7690;
      --on-accent: #fff;
      --shadow: 0 6px 24px rgba(64, 56, 58, .07)
    }

    [data-theme=dark] {
      --bg: #201D22;
      --bg2: #29252C;
      --card: #312C34;
      --text: #F7F0F3;
      --text2: #BEB1BC;
      --line: #443B46;
      --rose: #F8E3E8;
      --sky: #C2DAE8;
      --on-accent: #201D22;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Dongle", system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.1;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
    }

    h1,
    h2,
    h3 {
      font-weight: 700;
      margin: 0 0 .3em;
      line-height: .95
    }

    h1 {
      font-size: 3.2rem
    }

    h2 {
      font-size: 2.2rem
    }

    h3 {
      font-size: 1.6rem
    }

    p {
      margin: 0 0 .6em;
      line-height: 1.15
    }

    .logo {
      font-family: "Tourmines", "Snell Roundhand", "Brush Script MT", cursive;
      font-size: 2.4rem;
      color: var(--rose);
      line-height: 1
    }

    .muted {
      color: var(--text2)
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 2px
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: .35em 1.1em;
      font-weight: 700;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent);
      min-height: 44px;
      font-size: 1.2rem
    }

    .btn.alt {
      background: var(--blue);
      color: #33444F
    }

    .btn.ghost {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--text)
    }

    .btn.danger {
      background: transparent;
      border: 1.5px solid var(--rose);
      color: var(--rose)
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow)
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr))
    }

    label {
      display: block;
      margin: .5em 0 .1em;
      color: var(--text2)
    }

    input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      min-height: 46px;
      font-size: 1.2rem
    }

    .pw {
      position: relative
    }

    .pw button {
      position: absolute;
      right: 6px;
      top: 4px;
      min-height: 38px;
      padding: 0 .8em
    }

    .err {
      color: #B3414F;
      min-height: 1.2em;
      margin-top: .4em
    }

    [data-theme=dark] .err {
      color: #F2A0AB
    }

    .ok {
      color: var(--sky)
    }

    /* hero */
    .hero {
      display: grid;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))
    }

    .polaroids {
      position: relative;
      height: 300px
    }

    .pol {
      position: absolute;
      width: 150px;
      background: #fff;
      padding: 10px 10px 34px;
      box-shadow: var(--shadow);
      border-radius: 4px;
      color: #40383A;
      font-size: 1.2rem;
      text-align: center
    }

    .pol i {
      display: block;
      height: 120px;
      background: var(--pink)
    }

    .pol.b i {
      background: var(--blue)
    }

    .pol.a {
      left: 6%;
      top: 20px;
      transform: rotate(-6deg)
    }

    .pol.b {
      left: 42%;
      top: 70px;
      transform: rotate(5deg)
    }

    .pol.c {
      left: 18%;
      top: 150px;
      transform: rotate(-2deg)
    }

    .stat {
      font-size: 4rem;
      font-weight: 700;
      line-height: .9
    }

    .code {
      font-size: 2.6rem;
      letter-spacing: .15em;
      background: var(--bg2);
      border-radius: 14px;
      padding: .1em .5em;
      display: inline-block
    }

    .pill {
      background: var(--pink);
      color: #6B4650;
      border-radius: 999px;
      padding: .1em .7em;
      display: inline-block
    }

    [data-theme=dark] .pill {
      background: #4a3a44;
      color: var(--pink)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: .3em 1em;
      border-radius: 999px;
      z-index: 9
    }

    @media (prefers-reduced-motion:no-preference) {
      .btn {
        transition: transform .15s
      }

      .btn:active {
        transform: scale(.97)
      }
    }

    .nav {
      display: flex;
      gap: 6px
    }

    .nav button {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 1.3rem;
      padding: .2em .8em;
      border-radius: 999px;
      min-height: 44px;
      color: var(--text2)
    }

    .nav button.on {
      background: var(--pink);
      color: #6B4650
    }

    [data-theme=dark] .nav button.on {
      background: #4a3a44;
      color: var(--pink)
    }

    @media(max-width:640px) {
      body {
        padding-bottom: 76px
      }

      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        justify-content: space-around;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0))
      }
    }

    .mem {
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .ph {
      aspect-ratio: 4/3;
      width: 100%;
      flex: none;
      background: var(--pink) center/cover no-repeat
    }

    .mem .pad {
      padding: 12px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start
    }

    .mem h3,
    .mem p {
      margin: 0;
      width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1
    }

    .mem p {
      -webkit-line-clamp: 2;
      min-height: 2.3em
    }

    .mem .tag {
      margin-top: auto
    }

    .tag {
      background: var(--blue);
      color: #33444F;
      border-radius: 999px;
      padding: 0 .6em;
      margin-right: .3em;
      display: inline-block
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: .6em 0
    }

    .chips button {
      border: 1.5px solid var(--line);
      background: none;
      border-radius: 999px;
      padding: .1em .9em;
      min-height: 40px;
      cursor: pointer;
      font-size: 1.2rem
    }

    .chips button.on {
      background: var(--blue);
      color: #33444F;
      border-color: var(--blue)
    }

    textarea,
    select {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      font: inherit;
      font-size: 1.2rem;
      color: inherit;
      min-height: 46px
    }

    dialog.wide {
      width: min(94vw, 560px);
      max-height: 90vh
    }

    dialog::backdrop {
      background: rgba(32, 29, 34, .5)
    }

    .thumbs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .thumbs div {
      position: relative
    }

    .thumbs img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px
    }

    .thumbs button {
      position: absolute;
      top: -6px;
      right: -6px;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      border: 0;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent)
    }

    dialog {
      width: min(94vw, 560px);
      max-height: 90vh;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      color: var(--text)
    }

    .mgrid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      align-items: stretch
    }

    .fab {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 0;
      background: var(--rose);
      color: var(--on-accent);
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 6;
      display: grid;
      place-items: center
    }

    @media(max-width:640px) {
      .fab {
        bottom: calc(88px + env(safe-area-inset-bottom, 0px))
      }
    }

    .cw {
      position: relative;
      margin-bottom: .6em
    }

    .car {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      border-radius: 14px;
      scrollbar-width: none
    }

    .car::-webkit-scrollbar {
      display: none
    }

    .sl {
      flex: 0 0 100%;
      scroll-snap-align: center;
      height: min(45vh, 420px);
      background: var(--bg2)
    }

    .sl img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      display: block
    }

    .ar,
    .zx {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .88);
      color: #40383A;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2
    }

    .ar {
      top: 50%;
      transform: translateY(-50%)
    }

    .ar.l {
      left: 8px
    }

    .ar.r {
      right: 8px
    }

    .zx {
      top: 8px;
      right: 8px
    }

    .dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .25)
    }

    .dots i.on {
      background: var(--rose)
    }

    .ri {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      min-height: 64px
    }

    .ri .th {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      flex: none;
      background: var(--pink) center/cover
    }

    .tl {
      border-left: 3px solid var(--blue);
      padding-left: 14px
    }

    .tlh {
      margin-top: .8em
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-top: .6em
    }

    .cg b {
      color: var(--text2)
    }

    .cd {
      min-height: 46px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      border: 0;
      background: none;
      font-size: 1.2rem
    }

    .cd.has {
      background: var(--pink);
      color: #6B4650;
      cursor: pointer;
      font-weight: 700
    }

    [data-theme=dark] .cd.has {
      background: #4a3a44;
      color: var(--pink)
    }

    .cd.sel {
      outline: 2px solid var(--rose)
    }

    .cd i {
      font-size: .85rem;
      font-style: normal;
      line-height: 1
    }

    .hs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px
    }

    .hs .mem {
      width: 220px;
      flex: none
    }

    summary {
      cursor: pointer;
      list-style: none
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap
    }

    .stats div {
      font-size: 1.2rem;
      color: var(--text2)
    }

    .stats b {
      display: block;
      font-size: 2.6rem;
      color: var(--text);
      line-height: 1
    }

    dialog#lb {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: rgba(20, 17, 22, .95);
      color: #F7F0F3;
      overflow: hidden
    }

    dialog#lb::backdrop {
      background: transparent
    }

    #lb .bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 70px 0 18px;
      display: flex;
      align-items: center;
      font-size: 1.3rem;
      z-index: 1
    }

    #lb .st {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(56px + env(safe-area-inset-top, 0px));
      bottom: 96px;
      overflow: auto;
      display: flex
    }

    #lb .st img {
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      border-radius: 6px
    }

    #lb .st.z img {
      max-width: none;
      max-height: none;
      width: 200%;
      cursor: zoom-out
    }

    #lb .tn {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      overflow-x: auto
    }

    #lb .tn button {
      width: 56px;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0;
      background: var(--pink) center/cover;
      cursor: pointer;
      opacity: .55;
      flex: none
    }

    #lb .tn button.on {
      opacity: 1;
      border-color: var(--pink)
    }

    #lb .ar {
      background: rgba(255, 255, 255, .16);
      color: #fff
    }

    #lb .zx {
      background: rgba(255, 255, 255, .16);
      color: #fff;
      top: calc(6px + env(safe-area-inset-top, 0px))
    }

    @media(prefers-reduced-motion:no-preference) {
      #lb .st img {
        animation: lbi .25s
      }

      @keyframes lbi {
        from {
          opacity: 0;
          transform: scale(.98)
        }

        to {
          opacity: 1
        }
      }
    }

    .tli {
      position: relative;
      margin: 0 0 14px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .tli::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--rose)
    }

    .tli.auto::before {
      background: var(--blue)
    }

    .tli h3 {
      margin: .2em 0
    }

    @media(max-width:640px) {
      .nav button {
        padding: .2em .55em;
        font-size: 1.15rem
      }
    }

    .sm {
      display: none
    }

    @media(max-width:640px) {
      .lg {
        display: none
      }

      .sm {
        display: inline
      }
    }

    .erow-t {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%
    }

    .pri {
      font-size: 1.1rem
    }

    .top {
      flex-wrap: wrap
    }

    .nav {
      flex-wrap: wrap
    }

    .mb {
      display: none
    }

    @media(max-width:640px) {
      .dk {
        display: none
      }

      .mb {
        display: inline-block
      }
    }

    .pin {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--rose);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      box-shadow: var(--shadow);
      font-size: 1.1rem
    }

    #stage {
      position: relative;
      width: min(100%, 480px);
      aspect-ratio: 3/4;
      margin: 12px auto;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .si {
      position: absolute;
      cursor: grab;
      touch-action: none;
      background: #fff;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .22)
    }

    .si img {
      width: 100%;
      display: block;
      pointer-events: none
    }

    .si.sel {
      outline: 2px dashed var(--rose)
    }

    .si.tx {
      background: transparent;
      box-shadow: none;
      padding: 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: #40383A;
      line-height: 1
    }

    #kcv {
      max-width: 100%;
      max-height: 48vh;
      display: block;
      margin: 8px auto;
      border-radius: 8px;
      background: var(--bg2)
    }

    input[type=range] {
      padding: 0;
      min-height: 30px
    }

    .bsl {
      width: 84px;
      text-align: center
    }

    .bsl>button {
      width: 84px;
      height: 84px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 0;
      background: var(--bg2);
      overflow: hidden;
      cursor: pointer;
      font-size: 2rem;
      color: var(--text2)
    }

    .bsl.on>button {
      border-color: var(--rose);
      border-style: solid
    }

    .bsl img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .bsl .mini {
      display: flex;
      justify-content: space-between;
      margin-top: 4px
    }

    .bsl .mini button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--bg2);
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text)
    }

    #bcv {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
      margin: auto;
      border-radius: 8px;
      box-shadow: var(--shadow)
    }

    .bg h3 {
      margin-top: .8em
    }

    .skip {
      position: absolute;
      left: -999px;
      top: 0
    }

    .skip:focus {
      left: 8px;
      top: 8px;
      background: var(--card);
      padding: .3em .8em;
      border-radius: 8px;
      z-index: 99
    }

    html,
    body {
      overflow-x: hidden
    }

    img,
    canvas,
    video {
      max-width: 100%
    }

    [data-accent=sky] {
      --rose: #4A7690
    }

    [data-theme=dark][data-accent=sky] {
      --rose: #C2DAE8
    }

    /* ===== scrapbook feel: paper, tape, stitching, prints ===== */
    :root {
      --bg: #F4EDE0;
      --bg2: #EBE2D1;
      --card: #FFFDF8;
      --line: #E2D6C2
    }

    [data-theme=dark] {
      --bg: #231F25;
      --bg2: #29252C;
      --card: #312C34;
      --line: #443B46

    body.paperbg {
      background-color: var(--bg);
      background-image: var(--paper-l), radial-gradient(ellipse at 50% 25%, rgba(255, 255, 255, .55) 0, rgba(255, 255, 255, 0) 62%);
      background-size: 256px 256px, 100% 100%;
      background-attachment: scroll, fixed;
      min-height: 100vh
    }

    [data-theme=dark] body.paperbg {
      background-image: var(--paper-d), radial-gradient(ellipse at 50% 25%, rgba(255, 255, 255, .04) 0, rgba(255, 255, 255, 0) 62%)
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;

      box-shadow: 0 10px 18px -10px rgba(0, 0, 0, .65)
    }

    }

    [data-theme=dark] .hgrid>.card,

    [data-theme=dark] .csl,
    [data-theme=dark] .stpage {
      outline-color: rgba(255, 255, 255, .14)

    .hgrid>.card::before,
    .sgrid>.card::before,
    .csl::before,
    .mgrid>.mem::before,
    .hero2::before,
    .hero2::after {
      content: "";
      position: absolute;
      top: -10px;
      left: 50%;
      width: 70px;
      height: 20px;
      margin-left: -35px;
      transform: rotate(-2.5deg);
      background: color-mix(in srgb, var(--rose) 34%, transparent);
      box-shadow: 0 1px 2px rgba(0, 0, 0, .08);
      clip-path: polygon(3% 0, 100% 0, 97% 20%, 100% 40%, 97% 60%, 100% 80%, 97% 100%, 0 100%, 3% 80%, 0 60%, 3% 40%, 0 20%);
      pointer-events: none;
      z-index: 2

    .mgrid>.mem:nth-child(2n)::before {
      background: color-mix(in srgb, var(--sky) 38%, transparent);
      transform: rotate(2deg)
    }

    .hgrid>.card:nth-child(3n)::before,
    .sgrid>.card:nth-child(3n)::before,
    .mgrid>.mem:nth-child(3n)::before {
      background: rgba(238, 205, 105, .5);
      transform: rotate(-1deg)
    }

      border: 0;
      border-radius: 4px;
      box-shadow: 0 14px 26px -12px rgba(70, 50, 30, .45)
    }

    .hero2::before {
      left: 12%;
      transform: rotate(-6deg)
    }

    .hero2::after {
      left: auto;
      right: 12%;
      margin-left: 0;
      transform: rotate(5deg);
      background: color-mix(in srgb, var(--sky) 38%, transparent)
    }

    async function asSend(t) { t = (t || "").trim(); if (!t) return; asOpen(); S.chat.push({ r: "u", h: esc(t) }); asPaint(); try { const r = await asHandle(t); if (r) asBot(r) } catch (e) { asBot("Sorry, something went wrong with that. Try again, or say “help”.") } }
    function asGo(page, ct) { S.page = page; if (ct) { S.ct = ct; S.sp = null; S.fopen = null } scrollTo(0, 0); render(); if (innerWidth <= 640) asClose() }
    function asHelp() { return `Here's what I can do:<br>• <b>Open</b> a page: “open scrapbook”, “go to plans”<br>• <b>Plan</b>: “plan dinner tomorrow at 7pm”, “add Mia's birthday on 5 March”<br>• <b>Bucket list</b>: “add Kyoto trip to our bucket list”<br>• <b>Folders</b>: “new folder Seoul trip”<br>• <b>Memories</b>: “add a memory called Sunset walk”, “find memories about beach”, “memories from last month”<br>• <b>Quick answers</b>: “days together”, “what's coming up?”, “how many memories?”<br>• <b>Other</b>: “dark mode”, “mark all notifications as read”, “make a cutout”` }
    function asEventConfirm(row) { S.pend = { k: "event", row }; return `Add <b>“${esc(row.title)}”</b> on <b>${esc(fdt(row.start_date))}</b>${row.start_time ? " at <b>" + esc(row.start_time) + "</b>" : ""}${row.repeat_yearly ? ", repeating every year" : ""}?<div class="row" style="margin-top:6px">${abtn("aconf", "Add it")}${abtn("acancel", "Cancel")}</div>` }
    const RNG = t => {
      const n = new Date(), y = n.getFullYear(), m = n.getMonth(), f = d => d.toLocaleDateString("sv"); let mm = t.match(new RegExp("(" + MON.map(x => x.slice(0, 3)).join("|") + ")[a-z]*\\s*(\\d{4})?"));
      if (/last month/.test(t)) return [f(new Date(y, m - 1, 1)), f(new Date(y, m, 0))]; if (/this month/.test(t)) return [f(new Date(y, m, 1)), f(new Date(y, m + 1, 0))]; if (/last year/.test(t)) return [`${y - 1}-01-01`, `${y - 1}-12-31`]; if (/this year/.test(t)) return [`${y}-01-01`, `${y}-12-31`];
      if (/\b(in|from|during)\b/.test(t) && mm) { const mo = MON.findIndex(n2 => n2.startsWith(mm[1])), yy = mm[2] ? +mm[2] : y; return [f(new Date(yy, mo, 1)), f(new Date(yy, mo + 1, 0))] } const yr = t.match(/\b(19|20)\d{2}\b/); if (yr && /(in|from|during)/.test(t)) return [`${yr[0]}-01-01`, `${yr[0]}-12-31`]; return null
    };
    async function asHandle(q) {
      const t = q.toLowerCase().trim().replace(/[?!.]+$/, "");
      if (S.pend && S.pend.k === "needdate") { if (/^(cancel|never ?mind|no|stop)$/.test(t)) { S.pend = null; return "No problem." } const w = parseWhen(q); if (w.date) { const p = S.pend; S.pend = null; return asEventConfirm({ ...p.row, start_date: w.date, start_time: w.time || p.row.start_time || null }) } return "I still need a date, like “tomorrow”, “next Friday” or “12 March”. Or say cancel." }
      if (/^(help|what can you do|commands|how do (i|you) use)/.test(t)) return asHelp();
      if (/^(hi|hello|hey|yo)\b/.test(t)) return "Hi! What would you like to do?"; if (/^(thanks|thank you|thx)/.test(t)) return "Any time!";
      if (/\b(dark|night) mode\b/.test(t) || /\blight mode\b/.test(t)) { const th = /dark|night/.test(t) ? "dark" : "light"; if (await savePrefs({ theme: th })) { render(); return `Switched to ${th} mode.` } return "I couldn't save that." }
      if (/mark.*read|clear (my )?notifications/.test(t)) { const r = await sb.rpc("mark_all_notifications_read"); if (r.error) return "I couldn't do that: " + esc(msg(r.error)); S.unread = 0; loadUnread(); return "Done. All your notifications are marked as read." }
      if (/days together|how long (have we|are we)|how many days/.test(t)) { const c = S.couple; if (!c.start_date) return `You haven't set a start date yet. ${abtn("agoto", "Open settings", 'data-p="settings"')}`; const st = new Date(c.start_date + "T00:00"), n = new Date(), dd = dhms(st, n), days = Math.floor((n - st) / 864e5); return `You've been together <b>${days.toLocaleString()} days</b> (${dd[0]} year${dd[0] === 1 ? "" : "s"}, ${dd[1]} month${dd[1] === 1 ? "" : "s"}, ${dd[2]} day${dd[2] === 1 ? "" : "s"}), since ${esc(sinceStr(c.start_date))}.` }
      if (/(next|upcoming).*(plan|event|date|birthday)|what'?s (next|coming up|on)|coming up|anything planned|what do (we|i) have/.test(t) || /when is (our|the) (next )?anniversary|next anniversary/.test(t)) { await loadEv(); const t0 = todayIso(), l = occs(t0, new Date(Date.now() + 400 * 864e5).toLocaleDateString("sv")).filter(o => !o.e.busy && (o.e.auto || o.e.repeat_yearly || o.e.status === "planned")).slice(0, /anniversary/.test(t) ? 1 : 4); return l.length ? `Coming up:<br>${l.map(o => `• <b>${esc(o.e.title)}</b> · ${esc(fdt(o.d))} · ${esc(cdn(o.d))}`).join("<br>")}<div class="row" style="margin-top:6px">${abtn("agoto", "Open Plans", 'data-p="plans"')}</div>` : `Nothing is planned yet. Try “plan dinner tomorrow at 7pm”.` }
      if (/how many (memories|photos|keepsakes|stamps|places)/.test(t)) { await Promise.all([loadMems(), loadCnt(), loadStamps()]); return `You have <b>${S.mems.length}</b> memories with <b>${S.mems.reduce((n, m) => n + m.photos.length, 0)}</b> photos, <b>${S.cnt.p}</b> places, <b>${S.cnt.k}</b> keepsakes and <b>${S.stc}</b> stamps.` }
      if (/unread|any (new )?notifications|new notifications/.test(t)) { await loadUnread(); return S.unread ? `You have <b>${S.unread}</b> unread notification${S.unread === 1 ? "" : "s"}. ${abtn("agoto", "Open", 'data-p="notif"')}` : "You're all caught up." }
      let m;
      if (m = t.match(/(?:new|create|make|add)\s+(?:a\s+)?folder(?:\s+(?:called|named))?\s+(.+)/)) { S.pend = { k: "folder", name: cap(m[1].trim()) }; return `Create the folder <b>“${esc(S.pend.name)}”</b>?<div class="row" style="margin-top:6px">${abtn("aconf", "Create")}${abtn("acancel", "Cancel")}</div>` }
      if (/(bucket ?list|wish ?list)/.test(t) && /\b(add|put|save|new)\b/.test(t)) { const ti = cleanTitle(t.replace(/\b(to|on|in)\s+(my |our |the )?(bucket ?list|wish ?list)\b/g, " ").replace(/\b(bucket ?list|wish ?list)\b/g, " ").replace(/\s+/g, " ").trim()); if (!ti) return "What should I add to your bucket list?"; S.pend = { k: "bucket", title: ti }; return `Add <b>“${esc(ti)}”</b> to your bucket list?<div class="row" style="margin-top:6px">${abtn("aconf", "Add it")}${abtn("acancel", "Cancel")}</div>` }
      if (/^(?:add|new|create|write|record|save|start)\s+(?:a\s+|an\s+|new\s+)*(memory|diary entry|journal entry|diary)\b/.test(t)) { const mm = q.match(/(?:called|about|titled|named|of|:)\s*(.+)$/i); S.page = "diary"; editor(null, { title: mm ? cap(mm[1].trim()) : "", category: "Everyday Moments" }); if (innerWidth <= 640) asClose(); return mm ? "Opening a new memory with that title." : "Opening a new memory. Add a title, photos and your story." }
      if (/make (a )?cutout|cutout studio/.test(t)) { S.page = "coll"; S.ct = "kp"; if (innerWidth <= 640) asClose(); await collection(); cutOpen(); return "Opening the cutout studio." }
      if (/(birthday|anniversary)/.test(t) && /(\d|jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec|tomorrow|today|next|monday|tuesday|wednesday|thursday|friday|saturday|sunday)/.test(t) && !/^(when|what)/.test(t)) {
        const w = parseWhen(q), kind = /anniversary/.test(t) ? "Anniversary" : "Birthday"; let name = null, mm2 = w.rest.match(/(?:for|of)\s+([a-z' ]+?)(?:'s)?$/i) || w.rest.match(/([a-z]+)'s\s+(?:birthday|anniversary)/i) || w.rest.match(/(?:birthday|anniversary)\s+(?:for|of)\s+([a-z]+)/i); if (mm2) name = cap(mm2[1].replace(/\b(birthday|anniversary)\b/g, "").trim());
        const row = { title: name ? `${name}'s ${kind.toLowerCase()}` : (cleanTitle(w.rest) || kind), kind, start_date: w.date, start_time: w.time, repeat_yearly: true }; if (!w.date) { S.pend = { k: "needdate", row }; return `When is it? (for example “5 March” or “next Friday”)` } return asEventConfirm(row)
      }
      if (/^(add|create|plan|schedule|put|set up|book|remind me|i want to plan|let'?s plan)\b/.test(t)) { const w = parseWhen(q), ti = cleanTitle(w.rest); if (!ti) return "What should I call it? For example “plan dinner tomorrow at 7pm”."; const kind = /\b(trip|holiday|flight|vacation)\b/.test(t) ? "Trip" : /\b(date|dinner|lunch|movie|picnic)\b/.test(t) ? "Date" : "Activity", row = { title: ti, kind, start_date: w.date, start_time: w.time, repeat_yearly: false }; if (!w.date) { S.pend = { k: "needdate", row }; return `Got it: “${esc(ti)}”. When is it? (for example “tomorrow at 7pm” or “12 March”)` } return asEventConfirm(row) }
      const rg = /(memories|photos|memory)/.test(t) ? RNG(t) : null;
      if (rg && !/(add|new|create)\b/.test(t)) { Object.assign(S, { q: "", f: "all", fc: "", ft: "", fl: "", fd1: rg[0], fd2: rg[1], fb: "", fo: true }); S.page = "diary"; render(); if (innerWidth <= 640) asClose(); return `Showing memories from ${esc(fdt(rg[0]))} to ${esc(fdt(rg[1]))}.` }
      if (m = t.match(/^(?:find|search(?: for)?|look for|any|show me)\s+(?:my |our |the )?(?:memories|photos|memory|entries)?\s*(?:about|with|of|for|from)?\s*(.+)$/)) { const term = m[1].trim(); if (term && !/^(the )?(diary|plans?|calendar|timeline|perspectives?|places?|photo ?booth|settings?|notifications?|home|dashboard|scrapbook|keepsakes?|stamps?|folders?|collection|cutouts?)$/.test(term)) { Object.assign(S, { q: term, f: "all", fc: "", ft: "", fl: "", fd1: "", fd2: "", fb: "" }); S.page = "diary"; render(); if (innerWidth <= 640) asClose(); return `Showing memories matching “${esc(term)}”.` } }
      const nav = [[/\bscrapbook\b/, ["coll", "sb"]], [/\bkeepsakes?\b/, ["coll", "kp"]], [/\bstamps?\b/, ["coll", "st"]], [/\bfolders?\b/, ["coll", "fo"]], [/\bcutouts?\b/, ["coll", "kp"]], [/\bcollection\b/, ["coll"]], [/\b(photo ?booth|photobooth)\b/, ["booth"]], [/\bperspectives?\b/, ["persp"]], [/\btimeline\b/, ["timeline"]], [/\b(places?|map)\b/, ["places"]], [/\b(plans?|calendar|agenda|planner|bucket ?list)\b/, ["plans"]], [/\b(diary|memories|memory book)\b/, ["diary"]], [/\bnotifications?\b/, ["notif"]], [/\b(settings?|preferences|profile)\b/, ["settings"]], [/\b(home|dashboard)\b/, ["home"]]];
      if (/^(open|go to|go|show|show me|take me to|view|see|visit)\b/.test(t) || t.split(" ").length <= 3) { for (const [re, [pg, ct]] of nav) if (re.test(t)) { asGo(pg, ct); return `Opening ${esc(t.replace(/^(open|go to|go|show me|show|take me to|view|see|visit)\s+(the |my |our )?/, ""))}.` } }
      return `I'm not sure how to do that yet. ${abtn("asug", "Search memories for “" + q.slice(0, 30) + "”", `data-q="find ${esc(q)}"`)} ${abtn("asug", "Help", "data-q=\"help\"")}<br>I can open pages, add plans, birthdays, bucket-list ideas and folders, and answer quick questions.`
    }
    async function asRun(p) {
      let r, msgh; if (p.k === "event") { r = await sb.from("events").insert({ couple_id: S.couple.id, title: p.row.title, kind: p.row.kind, start_date: p.row.start_date, start_time: p.row.start_time || null, repeat_yearly: !!p.row.repeat_yearly, visibility: (S.profile && S.profile.prefs && S.profile.prefs.cal_share) || "shared" }); msgh = `Added <b>“${esc(p.row.title)}”</b> on ${esc(fdt(p.row.start_date))}. ${abtn("agoto", "Open Plans", 'data-p="plans"')}` }
      else if (p.k === "bucket") { r = await sb.from("bucket_items").insert({ couple_id: S.couple.id, title: p.title }); msgh = `Added <b>“${esc(p.title)}”</b> to your bucket list. ${abtn("agoto", "Open Plans", 'data-p="plans"')}` }
      else if (p.k === "folder") { r = await sb.from("folders").insert({ couple_id: S.couple.id, name: p.name }); msgh = `Created the folder <b>“${esc(p.name)}”</b>. ${abtn("agoto", "Open Folders", 'data-p="coll" data-ct="fo"')}` }
      if (!r) return; if (r.error) { asBot("I couldn't do that: " + esc(msg(r.error))); return } asBot(msgh); if (["home", "plans"].includes(S.page)) render()
    }
    document.addEventListener("submit", e => { if (e.target.id !== "asf") return; e.preventDefault(); const i = $("#asi"), v = i.value; i.value = ""; asSend(v) });


    function topbar() {
      const g = grp(); if (SUBS[g]) S.last[g] = S.page; asEnsure();
      return `<header class="top"><span class="logo">Eros</span><div class="topr"><button class="asb" data-act="asst" aria-label="Open assistant" title="Assistant">${svg(`<path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/>`)}</button><nav class="nav" aria-label="Main">${NAV.map(([k, l, ic]) => `<button data-act="nav" data-p="${SUBS[k] ? S.last[k] : k}" class="${g === k ? "on" : ""}" aria-label="${l}${k === "notif" && S.unread ? ", " + S.unread + " unread" : ""}" ${g === k ? 'aria-current="page"' : ""} title="${l}">${ic}${k === "notif" && S.unread > 0 ? `<b class="nb">${S.unread > 9 ? "9+" : S.unread}</b>` : ""}</button>`).join("")}</nav></div></header>${SUBS[g] ? `<nav class="subs" aria-label="${g === "together" ? "Together" : "Activities"}">${SUBS[g].map(([k, l]) => `<button data-act="nav" data-p="${k}" class="${S.page === k ? "on" : ""}" ${S.page === k ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</nav>` : ""}`
    }

    /* boot */
    sb.auth.onAuthStateChange(async (evt) => {
      if (evt === "PASSWORD_RECOVERY") { await load(); render(); hideSplash(); setTimeout(() => document.querySelector('[data-act=pw]')?.click(), 0); return }
      if (evt === "INITIAL_SESSION" || evt === "SIGNED_IN" || evt === "SIGNED_OUT" || evt === "USER_UPDATED") {
        setTimeout(async () => {
          if (evt === "SIGNED_IN" && !S.user) app.innerHTML = ldr(); await load();
          if (S.user && !S.couple && pendingCode()) { const r = await sb.rpc("accept_invite", { p_code: pendingCode() }); if (!r.error) { clearCode(); await load(); toast("You're paired. Welcome in!") } }
          render(); hideSplash()
        }, 0)
      }
    });
  </script>
