<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eros</title>
  <link rel="icon" type="image/png" href="Assets/images/logo.png">
  <link rel="apple-touch-icon" href="Assets/images/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    /* Logo wordmark font: Tourmines. Keep the file at Assets/font/Tourmines.otf (folder names are case-sensitive on Netlify). */
    @font-face {
      font-family: "Tourmines";
      src: url("Assets/font/Tourmines.otf") format("opentype");
      font-display: swap
    }

    :root {
      --pink: #F8E3E8;
      --blue: #C2DAE8;
      --bg: #FFFCFA;
      --bg2: #F8F4F1;
      --card: #fff;
      --text: #40383A;
      --text2: #6E6065;
      --line: #EEE5E7;
      --rose: #B05E74;
      --sky: #4A7690;
      --on-accent: #fff;
      --shadow: 0 6px 24px rgba(64, 56, 58, .07)
    }

    [data-theme=dark] {
      --bg: #201D22;
      --bg2: #29252C;
      --card: #312C34;
      --text: #F7F0F3;
      --text2: #BEB1BC;
      --line: #443B46;
      --rose: #F8E3E8;
      --sky: #C2DAE8;
      --on-accent: #201D22;
      --shadow: 0 6px 24px rgba(0, 0, 0, .35)
    }

    * {
      box-sizing: border-box
    }

    html,
    body {
      margin: 0;
      min-height: 100%
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Dongle", system-ui, sans-serif;
      font-size: 24px;
      line-height: 1.1;
      padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0)
    }

    h1,
    h2,
    h3 {
      font-weight: 700;
      margin: 0 0 .3em;
      line-height: .95
    }

    h1 {
      font-size: 3.2rem
    }

    h2 {
      font-size: 2.2rem
    }

    h3 {
      font-size: 1.6rem
    }

    p {
      margin: 0 0 .6em;
      line-height: 1.15
    }

    .logo {
      font-family: "Tourmines", "Snell Roundhand", "Brush Script MT", cursive;
      font-size: 2.4rem;
      color: var(--rose);
      line-height: 1
    }

    .muted {
      color: var(--text2)
    }

    button,
    input {
      font: inherit;
      color: inherit
    }

    :focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 2px
    }

    .btn {
      border: 0;
      border-radius: 999px;
      padding: .35em 1.1em;
      font-weight: 700;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent);
      min-height: 44px;
      font-size: 1.2rem
    }

    .btn.alt {
      background: var(--blue);
      color: #33444F
    }

    .btn.ghost {
      background: transparent;
      border: 1.5px solid var(--line);
      color: var(--text)
    }

    .btn.danger {
      background: transparent;
      border: 1.5px solid var(--rose);
      color: var(--rose)
    }

    .btn:disabled {
      opacity: .6;
      cursor: wait
    }

    .wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: var(--shadow)
    }

    .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0
    }

    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center
    }

    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr))
    }

    label {
      display: block;
      margin: .5em 0 .1em;
      color: var(--text2)
    }

    input {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      min-height: 46px;
      font-size: 1.2rem
    }

    .pw {
      position: relative
    }

    .pw button {
      position: absolute;
      right: 6px;
      top: 4px;
      min-height: 38px;
      padding: 0 .8em
    }

    .err {
      color: #B3414F;
      min-height: 1.2em;
      margin-top: .4em
    }

    [data-theme=dark] .err {
      color: #F2A0AB
    }

    .ok {
      color: var(--sky)
    }

    /* hero */
    .hero {
      display: grid;
      gap: 24px;
      align-items: center;
      padding: 24px 0;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr))
    }

    .polaroids {
      position: relative;
      height: 300px
    }

    .pol {
      position: absolute;
      width: 150px;
      background: #fff;
      padding: 10px 10px 34px;
      box-shadow: var(--shadow);
      border-radius: 4px;
      color: #40383A;
      font-size: 1.2rem;
      text-align: center
    }

    .pol i {
      display: block;
      height: 120px;
      background: var(--pink)
    }

    .pol.b i {
      background: var(--blue)
    }

    .pol.a {
      left: 6%;
      top: 20px;
      transform: rotate(-6deg)
    }

    .pol.b {
      left: 42%;
      top: 70px;
      transform: rotate(5deg)
    }

    .pol.c {
      left: 18%;
      top: 150px;
      transform: rotate(-2deg)
    }

    .stat {
      font-size: 4rem;
      font-weight: 700;
      line-height: .9
    }

    .code {
      font-size: 2.6rem;
      letter-spacing: .15em;
      background: var(--bg2);
      border-radius: 14px;
      padding: .1em .5em;
      display: inline-block
    }

    .pill {
      background: var(--pink);
      color: #6B4650;
      border-radius: 999px;
      padding: .1em .7em;
      display: inline-block
    }

    [data-theme=dark] .pill {
      background: #4a3a44;
      color: var(--pink)
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(20px + env(safe-area-inset-bottom, 0));
      transform: translateX(-50%);
      background: var(--text);
      color: var(--bg);
      padding: .3em 1em;
      border-radius: 999px;
      z-index: 9
    }

    @media (prefers-reduced-motion:no-preference) {
      .btn {
        transition: transform .15s
      }

      .btn:active {
        transform: scale(.97)
      }
    }

    .nav {
      display: flex;
      gap: 6px
    }

    .nav button {
      background: none;
      border: 0;
      cursor: pointer;
      font-size: 1.3rem;
      padding: .2em .8em;
      border-radius: 999px;
      min-height: 44px;
      color: var(--text2)
    }

    .nav button.on {
      background: var(--pink);
      color: #6B4650
    }

    [data-theme=dark] .nav button.on {
      background: #4a3a44;
      color: var(--pink)
    }

    @media(max-width:640px) {
      body {
        padding-bottom: 76px
      }

      .nav {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 5;
        justify-content: space-around;
        background: var(--card);
        border-top: 1px solid var(--line);
        padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0))
      }
    }

    .mem {
      padding: 0;
      overflow: hidden;
      cursor: pointer;
      text-align: left;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column
    }

    .ph {
      aspect-ratio: 4/3;
      width: 100%;
      flex: none;
      background: var(--pink) center/cover no-repeat
    }

    .mem .pad {
      padding: 12px 16px 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start
    }

    .mem h3,
    .mem p {
      margin: 0;
      width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 1
    }

    .mem p {
      -webkit-line-clamp: 2;
      min-height: 2.3em
    }

    .mem .tag {
      margin-top: auto
    }

    .tag {
      background: var(--blue);
      color: #33444F;
      border-radius: 999px;
      padding: 0 .6em;
      margin-right: .3em;
      display: inline-block
    }

    .chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: .6em 0
    }

    .chips button {
      border: 1.5px solid var(--line);
      background: none;
      border-radius: 999px;
      padding: .1em .9em;
      min-height: 40px;
      cursor: pointer;
      font-size: 1.2rem
    }

    .chips button.on {
      background: var(--blue);
      color: #33444F;
      border-color: var(--blue)
    }

    textarea,
    select {
      width: 100%;
      background: var(--bg2);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      padding: .3em .7em;
      font: inherit;
      font-size: 1.2rem;
      color: inherit;
      min-height: 46px
    }

    dialog.wide {
      width: min(94vw, 560px);
      max-height: 90vh
    }

    dialog::backdrop {
      background: rgba(32, 29, 34, .5)
    }

    .thumbs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .thumbs div {
      position: relative
    }

    .thumbs img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 10px
    }

    .thumbs button {
      position: absolute;
      top: -6px;
      right: -6px;
      border-radius: 50%;
      width: 26px;
      height: 26px;
      border: 0;
      cursor: pointer;
      background: var(--rose);
      color: var(--on-accent)
    }

    dialog {
      width: min(94vw, 560px);
      max-height: 90vh;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--card);
      color: var(--text)
    }

    .mgrid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr));
      align-items: stretch
    }

    .fab {
      position: fixed;
      left: 16px;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 0;
      background: var(--rose);
      color: var(--on-accent);
      cursor: pointer;
      box-shadow: var(--shadow);
      z-index: 6;
      display: grid;
      place-items: center
    }

    @media(max-width:640px) {
      .fab {
        bottom: calc(88px + env(safe-area-inset-bottom, 0px))
      }
    }

    .cw {
      position: relative;
      margin-bottom: .6em
    }

    .car {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      border-radius: 14px;
      scrollbar-width: none
    }

    .car::-webkit-scrollbar {
      display: none
    }

    .sl {
      flex: 0 0 100%;
      scroll-snap-align: center;
      height: min(45vh, 420px);
      background: var(--bg2)
    }

    .sl img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      display: block
    }

    .ar,
    .zx {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 0;
      background: rgba(255, 255, 255, .88);
      color: #40383A;
      font-size: 1.8rem;
      line-height: 1;
      cursor: pointer;
      z-index: 2
    }

    .ar {
      top: 50%;
      transform: translateY(-50%)
    }

    .ar.l {
      left: 8px
    }

    .ar.r {
      right: 8px
    }

    .zx {
      top: 8px;
      right: 8px
    }

    .dots {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      gap: 6px
    }

    .dots i {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .75);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, .25)
    }

    .dots i.on {
      background: var(--rose)
    }

    .ri {
      display: flex;
      gap: 12px;
      align-items: center;
      width: 100%;
      text-align: left;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      min-height: 64px
    }

    .ri .th {
      width: 56px;
      height: 56px;
      border-radius: 10px;
      flex: none;
      background: var(--pink) center/cover
    }

    .tl {
      border-left: 3px solid var(--blue);
      padding-left: 14px
    }

    .tlh {
      margin-top: .8em
    }

    .cg {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      margin-top: .6em
    }

    .cg b {
      color: var(--text2)
    }

    .cd {
      min-height: 46px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text2);
      border: 0;
      background: none;
      font-size: 1.2rem
    }

    .cd.has {
      background: var(--pink);
      color: #6B4650;
      cursor: pointer;
      font-weight: 700
    }

    [data-theme=dark] .cd.has {
      background: #4a3a44;
      color: var(--pink)
    }

    .cd.sel {
      outline: 2px solid var(--rose)
    }

    .cd i {
      font-size: .85rem;
      font-style: normal;
      line-height: 1
    }

    .hs {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px
    }

    .hs .mem {
      width: 220px;
      flex: none
    }

    summary {
      cursor: pointer;
      list-style: none
    }

    .stats {
      display: flex;
      gap: 18px;
      flex-wrap: wrap
    }

    .stats div {
      font-size: 1.2rem;
      color: var(--text2)
    }

    .stats b {
      display: block;
      font-size: 2.6rem;
      color: var(--text);
      line-height: 1
    }

    dialog#lb {
      position: fixed;
      inset: 0;
      width: 100vw;
      max-width: none;
      height: 100dvh;
      max-height: none;
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: rgba(20, 17, 22, .95);
      color: #F7F0F3;
      overflow: hidden
    }

    dialog#lb::backdrop {
      background: transparent
    }

    #lb .bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: calc(56px + env(safe-area-inset-top, 0px));
      padding: env(safe-area-inset-top, 0px) 70px 0 18px;
      display: flex;
      align-items: center;
      font-size: 1.3rem;
      z-index: 1
    }

    #lb .st {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(56px + env(safe-area-inset-top, 0px));
      bottom: 96px;
      overflow: auto;
      display: flex
    }

    #lb .st img {
      margin: auto;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      cursor: zoom-in;
      border-radius: 6px
    }

    #lb .st.z img {
      max-width: none;
      max-height: none;
      width: 200%;
      cursor: zoom-out
    }

    #lb .tn {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 96px;
      display: flex;
      gap: 8px;
      justify-content: center;
      align-items: center;
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
      overflow-x: auto
    }

    #lb .tn button {
      width: 56px;
      height: 56px;
      border: 2px solid transparent;
      border-radius: 10px;
      padding: 0;
      background: var(--pink) center/cover;
      cursor: pointer;
      opacity: .55;
      flex: none
    }

    #lb .tn button.on {
      opacity: 1;
      border-color: var(--pink)
    }

    #lb .ar {
      background: rgba(255, 255, 255, .16);
      color: #fff
    }

    #lb .zx {
      background: rgba(255, 255, 255, .16);
      color: #fff;
      top: calc(6px + env(safe-area-inset-top, 0px))
    }

    @media(prefers-reduced-motion:no-preference) {
      #lb .st img {
        animation: lbi .25s
      }

      @keyframes lbi {
        from {
          opacity: 0;
          transform: scale(.98)
        }

        to {
          opacity: 1
        }
      }
    }

    .tli {
      position: relative;
      margin: 0 0 14px;
      padding: 12px 14px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px
    }

    .tli::before {
      content: "";
      position: absolute;
      left: -22px;
      top: 20px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--rose)
    }

    .tli.auto::before {
      background: var(--blue)
    }

    .tli h3 {
      margin: .2em 0
    }

    @media(max-width:640px) {
      .nav button {
        padding: .2em .55em;
        font-size: 1.15rem
      }
    }

    .sm {
      display: none
    }

    @media(max-width:640px) {
      .lg {
        display: none
      }

      .sm {
        display: inline
      }
    }

    .erow-t {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      width: 100%
    }

    .pri {
      font-size: 1.1rem
    }

    .top {
      flex-wrap: wrap
    }

    .nav {
      flex-wrap: wrap
    }

    .mb {
      display: none
    }

    @media(max-width:640px) {
      .dk {
        display: none
      }

      .mb {
        display: inline-block
      }
    }

    .pin {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--rose);
      color: var(--on-accent);
      display: grid;
      place-items: center;
      border: 2px solid #fff;
      box-shadow: var(--shadow);
      font-size: 1.1rem
    }

    #stage {
      position: relative;
      width: min(100%, 480px);
      aspect-ratio: 3/4;
      margin: 12px auto;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: var(--shadow)
    }

    .si {
      position: absolute;
      cursor: grab;
      touch-action: none;
      background: #fff;
      padding: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .22)
    }

    .si img {
      width: 100%;
      display: block;
      pointer-events: none
    }

    .si.sel {
      outline: 2px dashed var(--rose)
    }

    .si.tx {
      background: transparent;
      box-shadow: none;
      padding: 0;
      font-size: 1.8rem;
      font-weight: 700;
      color: #40383A;
      line-height: 1
    }

    #kcv {
      max-width: 100%;
      max-height: 48vh;
      display: block;
      margin: 8px auto;
      border-radius: 8px;
      background: var(--bg2)
    }

    input[type=range] {
      padding: 0;
      min-height: 30px
    }

    .bsl {
      width: 84px;
      text-align: center
    }

    .bsl>button {
      width: 84px;
      height: 84px;
      border: 2px dashed var(--line);
      border-radius: 12px;
      padding: 0;
      background: var(--bg2);
      overflow: hidden;
      cursor: pointer;
      font-size: 2rem;
      color: var(--text2)
    }

    .bsl.on>button {
      border-color: var(--rose);
      border-style: solid
    }

    .bsl img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block
    }

    .bsl .mini {
      display: flex;
      justify-content: space-between;
      margin-top: 4px
    }

    .bsl .mini button {
      width: 36px;
      height: 36px;
      border: 0;
      border-radius: 10px;
      background: var(--bg2);
      cursor: pointer;
      font-size: 1.3rem;
      color: var(--text)
    }

    #bcv {
      width: 100%;
      max-height: 70vh;
      object-fit: contain;
      display: block;
      margin: auto;
      border-radius: 8px;
      box-shadow: var(--shadow)
    }

    .bg h3 {
      margin-top: .8em
    }

    .skip {
      position: absolute;
      left: -999px;
      top: 0
    }

    .skip:focus {
      left: 8px;
      top: 8px;
      background: var(--card);
      padding: .3em .8em;
      border-radius: 8px;
      z-index: 99
    }

    html,
    body {
      overflow-x: hidden
    }

    img,
    canvas,
    video {
      max-width: 100%
    }

    [data-accent=sky] {
      --rose: #4A7690
    }

    [data-theme=dark][data-accent=sky] {
      --rose: #C2DAE8
    }

    [data-deco=off] .polaroids {
      display: none
    }

    @media(prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important;
        scroll-behavior: auto !important
      }
    }

  ${S.bzE ? `<p class="err">${esc(msg(S.bzE))} Did you run schema_5.sql?</p>` : ""}${S.bz.length ? `<h2 style="margin-top:1em">Saved strips</h2><div class="hs">${S.bz.map(z => `<button class="card mem" data-act="bview" data-id="${z.id}"><div class="ph" style="background-image:url('${S.urls[z.path] || ""}');background-size:contain;background-color:var(--bg2);aspect-ratio:1/1" role="img" aria-label="Saved strip"></div><div class="pad"><p class="muted">${fdt(z.created_at.slice(0, 10))}</p></div></button>`).join("")}</div>` : ""}<dialog id="dlg"></dialog><dialog id="lb"></dialog>`; bthumbs(); bdraw($("#bcv"))
    }
    document.addEventListener("input", e => {const t = e.target, k = t.dataset && t.dataset.bb; if (!k) return; B[k] = t.type === "checkbox" ? t.checked : t.type === "range" ? +t.value : t.value; if (k === "lay") bthumbs(); bq()});
    document.addEventListener("change", async e => {if (e.target.id !== "bup") return; for (const f of e.target.files) {if (!/^image\//.test(f.type)) {toast(f.name + " isn't an image"); continue} try {const u = URL.createObjectURL(f), im = await bimg(u); if (!baddPhoto({im, url: u})) break} catch (x) {toast(f.name + " couldn't be read")} } e.target.value = ""});
    function bstop() {B.stream && B.stream.getTracks().forEach(t => t.stop()); B.stream = null}
    function bcam() {
      const d = $("#dlg"); d.innerHTML = `<h3>Camera</h3><video id="bv" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;transform:scaleX(-1)"></video><div class="err" id="bce" role="alert"></div><div class="row"><button class="btn" data-act="bsnap">Take photo</button><button class="btn ghost" data-act="bcamx">Done</button></div>`; d.showModal(); d.addEventListener("close", bstop, {once: true});
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {$("#bce").textContent = "This browser can't use the camera. Please upload photos instead."; return }
      navigator.mediaDevices.getUserMedia({video: {facingMode: "user"}, audio: false}).then(st => {B.stream = st; $("#bv").srcObject = st}).catch(() => {$("#bce").textContent = "Camera access was blocked or isn't available. Allow it in your browser settings, or upload photos instead."})
    }
    async function bdiary() {
      const ps = S.mems.length ? S.mems : (await loadMems(), S.mems), all = ps.filter(m => !m.archived).flatMap(m => m.photos).slice(0, 60); await signed(all); const d = $("#dlg");
      d.innerHTML = `<h3>Pick from your diary</h3>${all.length ? `<div class="thumbs" style="gap:8px">${all.map(p => `<button type="button" data-act="bpick" data-p="${p}" aria-label="Use this photo" style="border:0;padding:0;background:none;cursor:pointer"><img src="${S.urls[p] || ""}" alt="" style="width:84px;height:84px;object-fit:cover;border-radius:10px"></button>`).join("")}</div>` : `<p class="muted">No diary photos yet.</p>`}<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="close">Close</button></div>`; d.showModal()
    }
    async function bblob() {const c = document.createElement("canvas"); bdraw(c); return new Promise((ok, no) => {try {c.toBlob(b => b ? ok(b) : no(new Error("empty")), B.fmt === "jpeg" ? "image/jpeg" : "image/png", .95)} catch (e) {no(e)} })}
    function bsaveDlg() {
      const ms = S.mems.filter(m => !m.archived && m.photos.length < 8); dialog(`<h3>Save to Eros</h3><label for="bs1">Add this strip to</label><select id="bs1"><option value="">A new memory</option>${ms.map(m => `<option value="${m.id}">${esc(m.title)} (${fdt(m.memory_date)})</option>`).join("")}</select><label for="bs2">Title (for a new memory)</label><input id="bs2" maxlength="200" value="Photobooth ${fdt(B.date || todayIso())}">`,
        async () => {
          try {
            $("#derr").textContent = "Saving…"; const blob = await bblob(), id = crypto.randomUUID(), path = `${S.couple.id}/booth/${id}.${B.fmt === "jpeg" ? "jpg" : "png"}`, u = await sb.storage.from("memories").upload(path, blob, {contentType: blob.type}); if (u.error) throw u.error;
            let mid = $("#bs1").value || null; if (mid) {const m = S.mems.find(x => x.id === mid), r = await sb.from("memories").update({photos: [...m.photos, path]}).eq("id", mid); if (r.error) throw r.error}
            else {const t = $("#bs2").value.trim() || "Photobooth strip"; mid = crypto.randomUUID(); const r = await sb.from("memories").insert({id: mid, couple_id: S.couple.id, title: t, memory_date: B.date || todayIso(), category: "Everyday Moments", photos: [path]}); if (r.error) throw r.error}
            const r2 = await sb.from("photobooth_creations").insert({id, couple_id: S.couple.id, path, memory_id: mid, title: "Photobooth strip"}); if (r2.error) throw r2.error
          } catch (e) {return "Couldn't save: " + msg(e)}
          await booth(); toast("Saved to your memories")
        })
    }


    /* ---------- Settings, privacy, daily prompt (6) ---------- */
    const PROMPTS = ["What is one little thing I did recently that made you happy?", "What is a memory you wish we could relive?", "What should we do together this weekend?", "What is something small I do that you love?", "Where would you take us for a surprise trip?", "What song reminds you of us?", "What is one thing you are looking forward to with me?", "What was your favourite moment this week?", "What is a dish we should cook together?", "What is something you'd like us to try for the first time?", "What made you smile today?", "What do you want us to remember about this season of life?"];
    const pref = k => S.profile?.prefs?.[k] !== false;
    function applyPrefs() {const p = S.profile?.prefs || {}; document.documentElement.dataset.accent = p.accent || "rose"; document.documentElement.dataset.deco = p.deco === false ? "off" : "on"; if (p.theme) {try {localStorage.setItem("eros-theme", p.theme)} catch (e) { } applyTheme()} }
    async function savePrefs(patch) {const prefs = {...(S.profile.prefs || {}), ...patch}, r = await sb.from("profiles").update({prefs}).eq("id", S.user.id); if (r.error) {toast(msg(r.error) + " Did you run schema_6.sql?"); return false} S.profile.prefs = prefs; applyPrefs(); return true}
    function dailyHtml() {
      const q = PROMPTS[Math.floor(Date.now() / 864e5) % PROMPTS.length], rows = S.dp || [], mine = rows.find(r => r.user_id === S.user.id), oth = rows.find(r => r.user_id !== S.user.id), nm = S.members.find(m => oth && m.id === oth.user_id)?.display_name || "Your partner";
      return `<div class="card"><h3>Today's question</h3><p>${q}</p>` + (oth && mine ? `<p><strong>You</strong><br>${esc(mine.body)}</p><p><strong>${esc(nm)}</strong><br>${esc(oth.body)}</p>` : `<label for="dpa" class="muted">Your answer</label><textarea id="dpa" rows="2" maxlength="1000">${esc(mine?.body || "")}</textarea><button class="btn alt" data-act="dpsave" style="margin-top:.4em">${mine ? "Update my answer" : "Share my answer"}</button><p class="muted">${mine ? "Saved. Your partner's answer appears once they've answered too." : "You'll see each other's answers once you've both replied."}</p>`) + `</div>`
    }
    async function settings() {app.innerHTML = topbar() + `<h1>Settings</h1><p class="muted">Loading…</p>`; await signed([S.profile?.avatar_path, ...S.members.map(m => m.avatar_path)].filter(Boolean)); setPaint()}
    function setPaint() {
      const P = S.profile || {}, pr = P.prefs || {}, c = S.couple, partner = S.members.find(m => m.id !== S.user.id), paired = S.members.length >= 2, av = (path, n) => `<div role="img" aria-label="${esc(n || "Profile photo")}" style="width:72px;height:72px;border-radius:50%;background:var(--pink) center/cover;${path && S.urls[path] ? `background-image:url('${S.urls[path]}')` : ""}"></div>`, cb = (k, l, on) => `<label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${k}" style="width:auto;min-height:0" ${on ? "checked" : ""}> ${l}</label>`;
      app.innerHTML = topbar() + `<h1>Settings</h1><div class="grid" style="align-items:start">
  <div class="card"><h2>Your profile</h2><div class="row">${av(P.avatar_path, "Your photo")}<label class="btn ghost" style="margin:0">Change photo<input id="avf" type="file" accept="image/jpeg,image/png,image/webp" hidden></label></div>
   <label for="pdn">Display name</label><input id="pdn" value="${esc(P.display_name || "")}" maxlength="60"><label for="pnk">Nickname (used in your greeting)</label><input id="pnk" value="${esc(P.nickname || "")}" maxlength="40">
   <p class="muted" style="margin-top:.6em">Favourite memory categories</p><div class="chips" id="pfc">${CATS.map(k => `<label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" name="fc" value="${k}" style="width:auto;min-height:0" ${(P.fav_cats || []).includes(k) ? "checked" : ""}>${k}</label>`).join("")}</div><button class="btn" data-act="setprof">Save profile</button></div>
  <div class="card"><h2>Your relationship</h2><p><span class="pill">${paired ? "Paired with " + esc(partner?.display_name || "your partner") : "Waiting for partner"}</span></p>${paired ? `<div class="row">${av(partner?.avatar_path, "Your partner's photo")}<strong>${esc(partner?.nickname || partner?.display_name || "")}</strong></div>` : ""}
   <label for="rt">Relationship name</label><input id="rt" value="${esc(c.title || "")}" maxlength="80" placeholder="Us"><label for="rsd">Start date</label><input id="rsd" type="date" value="${c.start_date || ""}"><label for="ran">Anniversary date</label><input id="ran" type="date" value="${c.anniversary || ""}">
   ${paired ? "" : `<label for="rpn">Partner's name or nickname</label><input id="rpn" value="${esc(c.partner_name || "")}" maxlength="60">`}<div class="row" style="margin-top:.8em"><button class="btn" data-act="setrel">Save</button><button class="btn danger" data-act="leave">${paired ? "Disconnect from partner" : "Delete this space"}</button></div><p class="muted">More important dates (birthdays, trips) live in Plans.</p></div>
  <div class="card"><h2>Appearance</h2><label for="sth">Theme</label><select id="sth">${[["auto", "Match my device"], ["light", "Light"], ["dark", "Dark"]].map(([k, t]) => `<option value="${k}" ${(pr.theme || "auto") === k ? "selected" : ""}>${t}</option>`).join("")}</select><label for="sac">Accent colour</label><select id="sac"><option value="rose" ${pr.accent !== "sky" ? "selected" : ""}>Rose</option><option value="sky" ${pr.accent === "sky" ? "selected" : ""}>Dusty blue</option></select>${cb("sde", "Show soft decorations", pr.deco !== false)}<button class="btn" data-act="setapp" style="margin-top:.6em">Save appearance</button></div>
  <div class="card"><h2>Reminders</h2><p class="muted">These choose what shows in your in-app reminders. Email and push notifications aren't available yet.</p>${cb("nan", "Anniversary reminders", pref("anniv"))}${cb("nbd", "Birthday reminders", pref("bday"))}${cb("nda", "Upcoming date and event reminders", pref("dates"))}${cb("npr", "Daily couple question", pref("prompt"))}<button class="btn" data-act="setnot" style="margin-top:.6em">Save reminders</button></div>
  <div class="card"><h2>Privacy and data</h2><p class="muted">Only you and your partner can see your shared space. Nothing is public. Your partner never sees a Two Perspectives answer or a daily answer until you've both replied.</p><div class="row"><button class="btn alt" data-act="xjson">Download my data (JSON)</button><button class="btn ghost" data-act="xzip">Download all photos (ZIP)</button></div><p class="muted" style="margin-top:.6em">Lost your password? Log out and choose "Forgot password" on the log-in screen.</p></div>
  <div class="card"><h2>Account</h2><div class="row"><button class="btn ghost" data-act="pw">Change password</button><button class="btn ghost" data-act="logout">Log out</button></div><p class="muted" style="margin-top:.8em">Deleting your account removes your login for good. Shared memories stay with your partner. If you're the only member, the whole space and its photos are deleted.</p><button class="btn danger" data-act="delacc">Delete my account</button></div>
  </div><dialog id="dlg"></dialog>`}
    async function allPaths() {
      const g = async (t, c) => {const r = await sb.from(t).select(c).eq("couple_id", S.couple.id); return r.data || []}; const [m, k, z] = await Promise.all([g("memories", "photos"), g("keepsakes", "original_path,edited_path"), g("photobooth_creations", "path")]);
      return [...m.flatMap(x => x.photos), ...k.flatMap(x => [x.original_path, x.edited_path]), ...z.map(x => x.path), ...S.members.map(x => x.avatar_path)].filter(Boolean)
    }
    async function xjson(b) {
      b.disabled = true; const out = {exported_at: new Date().toISOString(), profile: S.profile, couple: S.couple};
      for (const t of ["memories", "timeline_entries", "events", "bucket_items", "places", "keepsakes", "scrapbook_pages", "perspectives", "perspective_answers", "photobooth_creations", "daily_answers"]) {const q = sb.from(t).select("*"), r = await (t === "perspective_answers" ? q : q.eq("couple_id", S.couple.id)); out[t] = r.error ? [] : r.data}
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], {type: "application/json"})); a.download = "eros-data.json"; a.click(); b.disabled = false; toast("Data downloaded")
    }
    async function xzip(b) {
      b.disabled = true; const old = b.textContent; try {
        b.textContent = "Preparing…"; if (!window.JSZip) await new Promise((ok, no) => {const sc = document.createElement("script"); sc.src = "https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"; sc.onload = ok; sc.onerror = no; document.head.append(sc)});
        const paths = [...new Set(await allPaths())]; if (!paths.length) {toast("No photos to download yet"); b.disabled = false; b.textContent = old; return } await signed(paths); const z = new JSZip(); let n = 0;
        for (const p of paths) {b.textContent = `Adding ${++n} of ${paths.length}…`; try {const r = await fetch(S.urls[p]); if (r.ok) z.file(p.split("/").slice(1).join("/"), await r.blob())} catch (e) { } }
        const bl = await z.generateAsync({type: "blob"}), a = document.createElement("a"); a.href = URL.createObjectURL(bl); a.download = "eros-photos.zip"; a.click(); toast("Photos downloaded")
      } catch (e) {toast("Couldn't build the ZIP. Try again on a stronger connection.")} b.disabled = false; b.textContent = old
    }
    document.addEventListener("change", async e => {
      if (e.target.id !== "avf" || !e.target.files[0]) return; try {
        const blob = await shrink(e.target.files[0]), path = `${S.couple.id}/profile/${S.user.id}.jpg`, u = await sb.storage.from("memories").upload(path, blob, {contentType: "image/jpeg", upsert: true}); if (u.error) throw u.error;
        const r = await sb.from("profiles").update({avatar_path: path}).eq("id", S.user.id); if (r.error) throw r.error; delete S.urls[path]; await load(); await signed([path]); setPaint(); toast("Photo updated")
      } catch (x) {toast("Couldn't update the photo: " + msg(x))}
    });

    /* boot */
    sb.auth.onAuthStateChange(async (evt) => {
      if (evt === "PASSWORD_RECOVERY") {await load(); render(); setTimeout(() => document.querySelector('[data-act=pw]')?.click(), 0); return }
      if (evt === "INITIAL_SESSION" || evt === "SIGNED_IN" || evt === "SIGNED_OUT" || evt === "USER_UPDATED") {
        setTimeout(async () => {
          await load();
          if (S.user && !S.couple && pendingCode()) {const r = await sb.rpc("accept_invite", {p_code: pendingCode()}); if (!r.error) {clearCode(); await load(); toast("You're paired. Welcome in!")} }
          render()
        }, 0)
      }
    });
  </script>
